<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>!!! O SITE DOS PINGUINS !!!</title>
    <style>
        /* Estilos de amador (CSS raiz) */
        body {
            font-family: "Comic Sans MS", "Comic Sans", cursive; /* A clássica fonte amadora */
            background-color: yellow; /* Cor de fundo bem forte */
            color: blue; /* Texto azul para dar contraste */
        }

        h1 {
            color: red;
            text-decoration: underline;
        }

        .card {
            background-color: cyan;
            border: 5px dashed red; /* Borda grossa e tracejada */
            width: 80%;
            padding: 10px;
            margin: 20px auto;
            text-align: center;
            display: none;
        }

        /* Mostra o card ativo */
        .card.ativo {
            display: block;
        }

        .card img {
            width: 300px;
            border: 4px solid black; /* Borda na imagem */
        }

        .botoes {
            margin-top: 20px;
        }

        button {
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            padding: 15px;
            font-size: 20px;
            border: 3px solid black;
            cursor: pointer;
            margin: 5px;
        }

        .btn-verdadeiro {
            background-color: lime; /* Verde neon */
        }

        .btn-falso {
            background-color: fuchsia; /* Rosa choque */
        }

        .resultado {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            background-color: white; /* Fundo branco pra dar pra ler */
            border: 2px solid black;
        }

        .btn-proximo {
            background-color: blue;
            color: white;
            font-size: 24px;
            margin-top: 15px;
            display: none;
            width: 100%;
        }
    </style>
</head>
<body>

    <center>
        <marquee scrollamount="15" width="80%"><h1>🐧🐧🐧 BEM VINDO AO MEU QUIZ DE PINGUIM!!! 🐧🐧🐧</h1></marquee>
        <hr color="red" size="5">
    </center>

    <div class="card ativo" id="card1">
        <h3>PERGUNTA 1 DE 5</h3>
        <img src="https://images.unsplash.com/photo-1598439210625-5067c578f3f6?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60" alt="Pinguim na neve">
        <h2>Pinguins vivem naturalmente no Polo Norte, junto com os ursos polares.</h2>
        
        <div class="botoes">
            <button class="btn-verdadeiro" onclick="responder(1, true)">!!! VERDADEIRO !!!</button>
            <button class="btn-falso" onclick="responder(1, false)">!!! FALSO !!!</button>
        </div>

        <div class="resultado" id="resultado1"></div>
        <button class="btn-proximo" id="proximo1" onclick="proximoCard(1)">>> PROXIMA <<</button>
    </div>

    <div class="card" id="card2">
        <h3>PERGUNTA 2 DE 5</h3>
        <img src="https://images.unsplash.com/photo-1551915995-17796d8b9d99?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60" alt="Pinguins na praia">
        <h2>Nem todos os pinguins vivem no gelo, algumas espécies vivem em praias de clima quente.</h2>
        
        <div class="botoes">
            <button class="btn-verdadeiro" onclick="responder(2, true)">!!! VERDADEIRO !!!</button>
            <button class="btn-falso" onclick="responder(2, false)">!!! FALSO !!!</button>
